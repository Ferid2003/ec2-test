name: Build and Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1 # TODO: edit to your target AWS region
  ARTIFACT_BUCKET: YOUR_ARTIFACT_BUCKET_NAME # TODO: edit to your S3 bucket name

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build fat JAR
        run: ./gradlew :web-app:bootJar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload JAR to S3
        run: aws s3 cp web-app/build/libs/*.jar s3://${{ secrets.ARTIFACT_BUCKET }}/
